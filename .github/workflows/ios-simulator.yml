name: iOS Simulator Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Test request features
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter test \
            test/pnu_api_test.dart \
            test/pnu_compensatory_time_off_tab_test.dart \
            test/pnu_filing_requests_tab_test.dart \
            test/pnu_service_requests_tab_test.dart

      - name: Build iOS Simulator app
        working-directory: mobile_app
        run: |
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=API_URL=https://ehris-mobile-demo.ednc.solutions/api
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ios/iphonesimulator/HRMS-Simulator.zip

      - name: Launch app in iOS Simulator and capture screen
        working-directory: mobile_app
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available --json | python3 -c \
            'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["isAvailable"] and device["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          APP_PATH=build/ios/iphonesimulator/Runner.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID"
          sleep 10
          mkdir -p build/ios/simulator-test
          xcrun simctl io "$DEVICE_UDID" screenshot \
            build/ios/simulator-test/HRMS-iOS-Simulator.png
          test -s build/ios/simulator-test/HRMS-iOS-Simulator.png

      - name: Upload simulator app and launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: HRMS-iOS-Simulator-Test
          path: |
            mobile_app/build/ios/iphonesimulator/HRMS-Simulator.zip
            mobile_app/build/ios/simulator-test/HRMS-iOS-Simulator.png
          if-no-files-found: error
          retention-days: 1
